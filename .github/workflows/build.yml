name: Build Sweetgram Debug APK

on:
  workflow_dispatch:
  push:
    branches: [rewrite]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Shallow submodules (smaller clone)
        run: git submodule update --init --recursive --depth 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK)
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses

      - name: Inject real google-services.json from secret
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > TMessagesProj_App/google-services.json
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > TMessagesProj/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon

      - name: Rename APK
        run: cp TMessagesProj_App/build/outputs/apk/afat/debug/*.apk Sweetgram-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sweetgram-debug-apk
          path: Sweetgram-debug.apk
