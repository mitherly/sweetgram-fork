name: Build Sweetgram Release APK

on:
  workflow_dispatch:
  push:
    branches: [rewrite]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Shallow submodules (smaller clone)
        run: git submodule update --init --recursive --depth 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK)
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses

      - name: Inject real google-services.json from secret
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > TMessagesProj_App/google-services.json
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > TMessagesProj/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon

      - name: Rename APK
        run: cp TMessagesProj_App/build/outputs/apk/afat/release/*.apk Sweetgram-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweetgram-release-apk
          path: Sweetgram-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4
          name: Sweetgram v0.4
          body: |
            Sweetgram форк Telegram — релизная сборка.
            - Розовый ребренд, верификация (Firebase).
            - Звук по тапу по слову Sweetgram.
            - Админ-панель управления верификацией.
          files: Sweetgram-release.apk
          make_latest: true
