name: Sweetgram Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25* || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26* || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools & NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;35.0.0" "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Sweetgram APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace

      - name: Upload Sweetgram APK
        uses: actions/upload-artifact@v4
        with:
          name: Sweetgram-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
