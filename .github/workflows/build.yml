name: Build Sweetgram APK

on:
  workflow_dispatch:
  push:
    branches: [rewrite]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Shallow submodules (smaller clone)
        run: git submodule update --init --recursive --depth 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK)
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses

      - name: Ensure release keystore exists
        run: |
          if [ ! -f TMessagesProj/config/release.keystore ]; then
            keytool -genkey -v \
              -keystore TMessagesProj/config/release.keystore \
              -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Sweetgram"
          fi

      - name: Inject real google-services.json from secret
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > TMessagesProj_App/google-services.json
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > TMessagesProj/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon

      - name: Rename APK
        run: cp TMessagesProj_App/build/outputs/apk/afat/release/app.apk Sweetgram-v12.10.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sweetgram-release-apk
          path: Sweetgram-v12.10.0.apk
